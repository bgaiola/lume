[package]
name = "lume-desktop"
version = "0.1.0"
description = "Lume desktop technician panel"
authors = ["Lume"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lume_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
