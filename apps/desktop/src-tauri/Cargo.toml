[package]
name = "lume-desktop"
version = "0.1.0"
description = "Lume desktop technician panel"
authors = ["Lume"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lume_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Cross-platform screen capture. xcap selects ScreenCaptureKit (macOS),
# Direct3D 11 / DXGI (Windows) and X11/PipeWire (Linux) under one API.
xcap = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
