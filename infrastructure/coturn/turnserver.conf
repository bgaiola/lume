# Lume coturn configuration (development).
# Production deployments should set realistic IPs, certificates, and
# stronger credentials, or use Cloudflare Calls TURN service instead.

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech

# Static long-term credentials for development. Override these via env in prod.
user=lume:lume_dev_turn_password
realm=lume.local

# Relay range. Keep small in dev to avoid host port pressure.
min-port=49160
max-port=49200

# Logging
log-file=stdout
verbose

# Disable insecure features
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Listen on all interfaces (host network mode in docker-compose).
listening-ip=0.0.0.0
