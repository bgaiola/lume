name: Desktop release

# Triggers:
#   - Push of a tag matching `desktop-v*` (e.g. `desktop-v0.1.0`).
#   - Manual run from the Actions UI for spot builds.
on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: macos-arm64, runner: macos-14, target: aarch64-apple-darwin }
          - { name: macos-intel, runner: macos-13, target: x86_64-apple-darwin }
          - { name: windows-x64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: linux-x64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        # Version is read from the root package.json `packageManager`
        # field. Passing `version:` here too makes pnpm/action-setup
        # hard-fail with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.platform.name }}

      - name: Install Linux system deps
        if: contains(matrix.platform.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libpipewire-0.3-dev \
            libxdo-dev

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the panel (apps/web) and its workspace deps
        # Turbo walks the `dependsOn: ["^build"]` graph so the internal
        # packages (@lume/protocol, @lume/webrtc, @lume/shared) are
        # built first; otherwise tsc fails to resolve them inside the
        # web app build.
        run: pnpm exec turbo run build --filter=@lume/web

      - name: Build desktop bundle
        # No code-signing env vars yet: Apple Developer ID is pending
        # and Windows EV cert is not on the roadmap. Tauri reads APPLE_*
        # / WINDOWS_* from the environment and tries to sign as soon as
        # any of them is set, even to an empty string, so we deliberately
        # do not pass them at all. When the certs land, re-add an `env:`
        # block guarded by `if: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}`.
        run: pnpm --filter @lume/desktop bundle

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lume-desktop-${{ matrix.platform.name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.app
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: warn

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Lume Desktop ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
